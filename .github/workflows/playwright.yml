name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        # No Google credentials: the suite runs against the in-memory sheet
        # backend (playwright.config.ts sets SHEETS_BACKEND=memory), so it no
        # longer registers and deletes real accounts in the shared dev
        # spreadsheet. Verified by running the whole suite with no credentials
        # present at all.
        #
        # SMTP is intentionally absent too — mailer.ts suppresses delivery
        # whenever NODE_ENV != production and MAIL_DEV_SEND != 1, so no mail
        # leaves CI.
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
