name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
        GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        # Both point at the dev sheet: sheetsClient prefers _DEV outside production,
        # but configStore and /api/spreadsheet-url read the unsuffixed name directly.
        # The production spreadsheet ID is deliberately not available to CI.
        GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID_DEV }}
        GOOGLE_SHEETS_SPREADSHEET_ID_DEV: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID_DEV }}
        # SMTP is intentionally absent — mailer.ts suppresses delivery whenever
        # NODE_ENV != production and MAIL_DEV_SEND != 1, so no mail leaves CI.
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
