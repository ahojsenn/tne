# Redirect HTTP -> HTTPS for konfi.kommitment.works
server {
    listen 80;
    listen [::]:80;
    server_name konfi.kommitment.works;
    return 301 https://$host$request_uri;
}

# HTTPS + reverse proxy with WebSocket support for Socket.io
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name konfi.kommitment.works;

    ssl_certificate     /etc/letsencrypt/live/konfi.kommitment.works/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/konfi.kommitment.works/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;                    # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                          # managed by Certbot

    # Proxy all traffic to Node.js, with WebSocket/Socket.io support
    location / {
        # 127.0.0.1, not localhost: the app binds loopback IPv4 only (see
        # HOST in tne.service), and "localhost" can resolve to ::1 on a box
        # whose /etc/hosts says so — which would 502 with no obvious cause.
        proxy_pass             http://127.0.0.1:3000;
        proxy_http_version     1.1;

        # WebSocket upgrade headers (required for Socket.io)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-lived WebSocket connections
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    location ~ ^/~(.+?)(/.*)?$ {
        add_header Access-Control-Allow-Origin *;
        alias /home/$1/public_html$2;
        index index.html index.htm;
        autoindex on;
    }
}
