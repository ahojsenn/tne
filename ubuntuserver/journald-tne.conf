# Installed by bootstrap.sh to /etc/systemd/journald.conf.d/tne.conf
#
# A drop-in rather than an edit to /etc/systemd/journald.conf, so package
# upgrades to that file never conflict with this setting.
#
# Note this caps the WHOLE system journal, not just tne.service — journald has
# one store shared by every unit. It was sitting at 1.8G on a 19G disk, which is
# roughly systemd's implicit default of 10% of the filesystem, so the journal
# was effectively self-limiting at a size nobody had chosen.
#
# 500M is plenty here: the app's own volume is modest, and at this size the
# journal still holds many weeks of history.

[Journal]
SystemMaxUse=500M
